# Served by nginxinc/nginx-unprivileged (never runs as root) on the default unprivileged 8080.
#
# No TLS here and no ACME challenge handling: this container is never internet-facing. The host
# (srv1758903 / 72.62.21.175) runs one shared Traefik instance in front of every app on the box
# (/docker/traefik), listening on 80/443, terminating TLS and getting its own Let's Encrypt certs
# per Host() router via Docker labels — see the `nginx` service's labels in
# docker-compose.prod.yml. This container only needs to speak plain HTTP to Traefik on the
# internal compose network.

server {
  listen 8080;
  server_name pjs.agilemorph.in;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

  # Same-origin /api so the browser never needs CORS.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Traefik (the actual internet-facing hop) already sets these from the real client;
    # append to them rather than overwrite with $remote_addr, which here is just Traefik's IP.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # SPA fallback so client-side routes (e.g. /stage/n-gate) work on a hard refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
