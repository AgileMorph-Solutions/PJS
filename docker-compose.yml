services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anagroci
      POSTGRES_PASSWORD: anagroci
      POSTGRES_DB: anagroci
    ports:
      # Published so `prisma migrate dev` / `npm run seed` work from the host against this same DB.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Without this the backend races the DB and `prisma migrate deploy` fails on first boot.
      test: ["CMD-SHELL", "pg_isready -U anagroci -d anagroci"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://anagroci:anagroci@db:5432/anagroci?schema=public
      PORT: "3000"
      # Browser hits the frontend on :8080; nginx proxies /api, but a direct dev call needs CORS.
      CORS_ORIGIN: http://localhost:8080
      # First admin, created by the seed only while no admin exists. No default password: leave
      # ADMIN_PASSWORD unset and no admin is created (export it, or put it in a .env file).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Demo accounts, one per role (admin, incharge.bouake, manager.bouake, qfs.bouake) — DEV ONLY,
      # with one shared, publicly-known password. Set SEED_DEMO_USERS=false for anything shared or
      # deployed, and change DEMO_PASSWORD if you keep them.
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-pass-123}
    # DEV: same startup as the image (migrate, seed, serve), but the last step is `tsx watch`, so the
    # API restarts by itself whenever a source file under ./backend or ./packages/contract is saved.
    # (A new migration or a changed prisma/schema.prisma still needs `docker compose restart backend`
    # — migrate and prisma generate run at startup, not on every save.) `prisma generate` has to be
    # in this command: the source is bind-mounted but the Prisma client lives in the image, so
    # without it a schema change leaves the old client behind and the API crashes on start
    # ("Unknown argument …") until the image is rebuilt. docker-compose.prod.yml is the real
    # deployment; nothing here is used there.
    command:
      - sh
      - -c
      - npx prisma migrate deploy && npx prisma generate && npx tsx prisma/seed.ts && npx tsx watch src/server.ts
    volumes:
      - ./backend:/app/backend
      - ./packages/contract:/app/packages/contract
      # Keep the container's own node_modules (Linux binaries, Prisma's generated client): the bind
      # mount above would otherwise cover them with the host's macOS ones.
      - /app/backend/node_modules
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      # Repo root, not ./frontend — the app depends on the @anagroci/contract workspace package.
      context: .
      dockerfile: frontend/Dockerfile
      # DEV: stop at the Node + dependencies stage, not the nginx one — this service runs the Vite
      # dev server so a saved file shows up in the browser at once (hot reload), instead of serving
      # a static bundle that would need a rebuild.
      target: build
    command: ["npm", "-w", "frontend", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      # Vite proxies /api to the backend (vite.config.ts), same as nginx does in the production image.
      VITE_API_TARGET: http://backend:3000
    volumes:
      - ./frontend:/app/frontend
      - ./packages/contract:/app/packages/contract
      # As for the backend: keep the container's own node_modules (rolldown ships a native binding).
      - /app/frontend/node_modules
    ports:
      # Still http://localhost:8080 in the browser; Vite listens on 5173 inside the container.
      - "8080:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
