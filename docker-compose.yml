services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anagroci
      POSTGRES_PASSWORD: anagroci
      POSTGRES_DB: anagroci
    ports:
      # Published so `prisma migrate dev` / `npm run seed` work from the host against this same DB.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Without this the backend races the DB and `prisma migrate deploy` fails on first boot.
      test: ["CMD-SHELL", "pg_isready -U anagroci -d anagroci"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://anagroci:anagroci@db:5432/anagroci?schema=public
      PORT: "3000"
      # Browser hits the frontend on :8080; nginx proxies /api, but a direct dev call needs CORS.
      CORS_ORIGIN: http://localhost:8080
      # First admin, created by the seed only while no admin exists. No default password: leave
      # ADMIN_PASSWORD unset and no admin is created (export it, or put it in a .env file).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Demo accounts, one per role (admin, incharge.bouake, manager.bouake, qfs.bouake) — DEV ONLY,
      # with one shared, publicly-known password. Set SEED_DEMO_USERS=false for anything shared or
      # deployed, and change DEMO_PASSWORD if you keep them.
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-pass-123}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      # Repo root, not ./frontend — the app depends on the @anagroci/contract workspace package.
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
